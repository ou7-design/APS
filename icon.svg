<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
  </defs>

  <!-- Base background (rounded square) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3"/>

  <!-- NFC PRIME Brand Icon: Stylized N with NFC Waves -->
  <g transform="translate(0, 0)" stroke="#ffffff" fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left vertical and curved diagonal wave -->
    <path d="M 162, 360 L 162, 152 C 170, 172 188, 195 218, 206 C 292, 216 352, 272 352, 360" />
    
    <!-- Right vertical stem -->
    <path d="M 352, 152 L 352, 360" />
    
    <!-- NFC Wave Arc 1 (Outer/Middle) -->
    <path d="M 212, 252 C 266, 252 310, 296 310, 360" />
    
    <!-- NFC Wave Arc 2 (Inner) -->
    <path d="M 212, 306 C 242, 306 264, 328 264, 360" />
  </g>
</svg>

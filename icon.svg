<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0f11"/>
      <stop offset="50%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    
    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#e5e5ea"/>
      <stop offset="100%" stop-color="#8e8e93"/>
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background (rounded square for icon standard) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="4"/>

  <!-- Logo Graphics: Glowing background shape -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="32" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="2"/>

  <!-- Logo Text: APS -->
  <text x="256" y="290" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Space Grotesk', Roboto, sans-serif" 
        font-size="120" 
        font-weight="900" 
        fill="url(#textGrad)" 
        text-anchor="middle" 
        letter-spacing="-4">
    APS
  </text>
  
  <!-- Subtitle or accent dot -->
  <circle cx="390" cy="210" r="14" fill="#ffffff" filter="url(#glow)"/>
</svg>

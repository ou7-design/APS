<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Obsidian) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#070709"/>
    </linearGradient>
  </defs>

  <!-- Base background (rounded square) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="3"/>

  <!-- NFC PRIME Brand Icon: Stylized N with NFC Waves -->
  <g transform="translate(0, 0)" stroke="#ffffff" fill="none" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left vertical and curved diagonal wave -->
    <path d="M 140, 365 L 140, 160 C 190, 185 275, 250 372, 365" />
    
    <!-- Right vertical stem -->
    <path d="M 372, 150 L 372, 365" />
    
    <!-- NFC Wave Arc 1 (Outer/Middle) -->
    <path d="M 205, 255 C 265, 268 318, 308 335, 365" />
    
    <!-- NFC Wave Arc 2 (Inner) -->
    <path d="M 205, 305 C 242, 312 272, 334 282, 365" />
  </g>
</svg>

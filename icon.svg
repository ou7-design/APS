<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#171719"/>
      <stop offset="50%" stop-color="#0a0a0c"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
    
    <!-- Champagne Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e6c8"/>
      <stop offset="40%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#c7a667"/>
      <stop offset="100%" stop-color="#997a3a"/>
    </linearGradient>

    <!-- Studio White Gradient -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d1d1d6"/>
    </linearGradient>
    
    <!-- Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base background (rounded square) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Subtle inner border with gold tint -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="rgba(199, 166, 103, 0.25)" stroke-width="3"/>

  <!-- Glowing NFC Wave Arcs -->
  <g transform="translate(256, 140)" stroke="url(#goldGrad)" fill="none" stroke-linecap="round">
    <path d="M -45 -10 A 50 50 0 0 1 45 -10" stroke-width="6" opacity="0.4"/>
    <path d="M -30 6 A 34 34 0 0 1 30 6" stroke-width="5.5" opacity="0.75"/>
    <path d="M -15 20 A 18 18 0 0 1 15 20" stroke-width="5"/>
    <circle cx="0" cy="32" r="4.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Logo Text: NP -->
  <text x="220" y="360" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Space Grotesk', Roboto, sans-serif" 
        font-size="160" 
        font-weight="900" 
        fill="url(#whiteGrad)" 
        text-anchor="middle" 
        letter-spacing="-6">
    N
  </text>
  <text x="325" y="360" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Space Grotesk', Roboto, sans-serif" 
        font-size="160" 
        font-weight="900" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="-6"
        filter="url(#glow)">
    P
  </text>
  
  <!-- Subtitle: NFC PRIME -->
  <text x="256" y="420" 
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Space Grotesk', Roboto, sans-serif" 
        font-size="24" 
        font-weight="700" 
        fill="url(#goldGrad)" 
        text-anchor="middle" 
        letter-spacing="6"
        opacity="0.9">
    NFC PRIME
  </text>
</svg>
